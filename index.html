<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151d35">
    <title>CinemaX</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="nav-header">
        <a class="logo" href="index.html"><i class="fa-solid fa-ticket"></i> Cinema</a>

        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"
            aria-controls="navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="navigation" id="navigation">
            <ul class="nav-links">
                <li><a id="active" href="index.html">Home</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="search">
            <input type="search" id="search" placeholder="Search movies..." aria-label="Search movies">
            <button class="search-button" id="search-button" type="button" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <main>
        <header class="main-header">
            <h1>Recent Movies</h1>
        </header>

        <section class="movie-list" aria-label="Recent movies">
            <p class="loading-message">Loading movies...</p>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 CinemaX. All rights reserved. Created By Nijat Abdurahmanzada</p>
    </footer>

    <!-- Movie booking dialog -->
    <dialog class="booking-dialog" id="booking_dialog">
        <div class="booking-modal">
            <div class="booking-container">
                <section class="seating-map" id="seating-map" aria-label="Cinema seat selection">
                    <div class="map-info-container" id="map_info_container"></div>
                </section>

                <aside class="cinema-description">
                    <button id="close-booking-dialog" class="close-dialog" type="button" aria-label="Close booking">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    
                    <div class="description-content">
                        <p class="eyebrow">NOW BOOKING</p>
                        <h2 id="venue-title">Movie title</h2>
                        <div class="total">
                            <p id="booking-price">Total: 0.00 AZN</p>
                            <button id="add-to-cart" type="button" aria-label="Add selected seats to cart">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </button>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </dialog>

    <!-- Cart button -->
    <button class="in-cart" id="in-cart" type="button" aria-label="Open booked seats">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-count" id="cart-count">0</span>
    </button>

    <!-- Cart dialog -->
    <dialog class="in-cart-modal-container" id="in-cart-modal-container">
        <div class="in-cart-modal">
            <header class="in-cart-header">
                <span>Booked Seats</span>
                <button id="close-in-cart-modal" type="button" aria-label="Close cart">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <div class="in-cart-main"></div>

            <footer class="in-cart-footer">
                <p>Total:</p>
                <strong id="footer-price">0.00 AZN</strong>
            </footer>
        </div>
    </dialog>

    <script src="js/app.js" type="module"></script>
</body>

</html>
